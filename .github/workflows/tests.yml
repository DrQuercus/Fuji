name: Tests

on:
  push:
  pull_request:

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Dépendances système (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libxcb-xinerama0 libxcb-randr0 libxcb-render-util0 libxcb-image0
      - name: Installation
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests
      - name: Tests (Linux, avec interface)
        if: runner.os == 'Linux'
        run: xvfb-run -a pytest
      - name: Tests (macOS, sans interface)
        if: runner.os == 'macOS'
        run: pytest -m "not gui"
      - name: Tests de l'interface (macOS, à titre d'essai)
        if: runner.os == 'macOS'
        continue-on-error: true
        timeout-minutes: 20
        run: pytest -m gui
