name: Application macOS

# Fabrique Fuji.app et son .dmg, pour les Mac à processeur Apple et Intel.
#   - à la main : onglet « Actions » → « Application macOS » → « Run workflow » ;
#   - à chaque version publiée (étiquette v…) : les .dmg sont joints à la version ;
#   - quand l'empaquetage lui-même change.
on:
  workflow_dispatch:
  push:
    branches: ["**"]
    tags: ["v*"]
    paths:
      - "packaging/**"
      - "pyproject.toml"
      - "src/fuji/ui/selftest.py"
      - ".github/workflows/macos-app.yml"

permissions:
  contents: write  # joindre les .dmg à une version

jobs:
  dmg:
    name: ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: macos-15, arch: arm64, label: "Apple Silicon (M1, M2, M3…)"}
          - {runner: macos-15-intel, arch: x86_64, label: "Intel"}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Outil d'empaquetage
        run: python -m pip install --upgrade pip briefcase
      - name: Construction de Fuji.app
        run: |
          briefcase create macOS app --no-input
          briefcase build macOS app --no-input
          du -sh build/fuji/macos/app/Fuji.app
      - name: Version de macOS exigée
        run: |
          set -o pipefail
          python packaging/macos/check_min_os.py build/fuji/macos/app/Fuji.app --strict | tee version-macos.txt
      - name: Essai de l'application
        timeout-minutes: 10
        run: |
          APP="build/fuji/macos/app/Fuji.app/Contents/MacOS/Fuji"
          "$APP" profiles
          "$APP" selftest --report selftest.json --screenshot selftest.png
      - name: Résultat de l'essai
        if: always()
        run: |
          test -f selftest.json && cat selftest.json || echo "pas de rapport"
          cat version-macos.txt || true
      - name: Fabrication du .dmg
        run: |
          briefcase package macOS app --adhoc-sign --no-input
          VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          mv dist/Fuji-*.dmg "dist/Fuji-${VERSION}-macOS-${{ matrix.arch }}.dmg"
          ls -lh dist
      - uses: actions/upload-artifact@v4
        with:
          name: Fuji-macOS-${{ matrix.arch }}
          path: dist/*.dmg
          if-no-files-found: error
          compression-level: 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: essai-${{ matrix.arch }}
          path: |
            selftest.json
            selftest.png
          if-no-files-found: ignore
      - name: Joindre à la version publiée
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "Fuji ${GITHUB_REF_NAME#v}" --generate-notes
          gh release upload "$GITHUB_REF_NAME" dist/*.dmg --clobber
