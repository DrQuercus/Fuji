[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "fuji-microscopy"
version = "1.0.0"
description = "Logiciel de microscopie : acquisition multi-microscopes, assistants d'alignement et analyse d'images (napari + Micro-Manager + Fiji)."
readme = "README.md"
requires-python = ">=3.10"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
keywords = ["microscopy", "imagej", "fiji", "napari", "micro-manager", "acquisition"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "scikit-image>=0.22",
    "pandas>=2.0",
    "tifffile>=2024.1",
    "pydantic>=2.5",
    "pyyaml>=6.0",
    "psygnal>=0.11",
    "useq-schema>=0.5",
]

[project.optional-dependencies]
# Interface graphique (napari + Qt)
gui = ["napari[pyqt6]>=0.10,<0.11", "magicgui>=0.8", "superqt>=0.6"]
# Compatibilité avec ~250 microscopes/périphériques via Micro-Manager
micromanager = ["pymmcore-plus>=0.13"]
# Pont vers Fiji / ImageJ (macros, plugins, Bio-Formats)
imagej = ["pyimagej>=1.5"]
# Motorisation maison : contrôleurs G-code (GRBL, FluidNC, Marlin) par le port série
moteurs = ["pyserial>=3.5"]
# Pilotage par une IA : serveur MCP (Model Context Protocol)
ia = ["mcp>=2.0", "uvicorn>=0.30", "pillow>=10"]
all = ["fuji-microscopy[gui,micromanager,imagej,moteurs,ia]"]
dev = ["fuji-microscopy[all]", "pytest>=8", "pytest-qt>=4.4", "ruff>=0.5"]

[project.scripts]
fuji = "fuji.cli:main"

# Points d'extension : un paquet tiers peut ajouter ses propres pilotes
# ou opérations d'analyse sans modifier Fuji.
[project.entry-points."fuji.drivers"]

[project.entry-points."fuji.operations"]

# ----------------------------------------------------------- application empaquetée
# « briefcase package macOS » fabrique Fuji.app et son .dmg : voir docs/INSTALLATION_MAC.md.
# Le nom, la version, la licence et les dépendances de base viennent de [project].
[tool.briefcase]
project_name = "Fuji"
bundle = "io.github.drquercus"
author = "Les contributeurs de Fuji"
url = "https://github.com/DrQuercus/Fuji"

[tool.briefcase.app.fuji]
formal_name = "Fuji"
description = "Microscopie : acquisition, assistants d'alignement et analyse d'images"
icon = "packaging/icons/fuji"
sources = ["src/fuji"]
# L'application contient tout ce que propose « pip install fuji-microscopy[all] ».
# (Liste à garder identique aux options de [project.optional-dependencies] : un test le vérifie.)
requires = [
    "napari[pyqt6]>=0.10,<0.11",
    "magicgui>=0.8",
    "superqt>=0.6",
    "pymmcore-plus>=0.13",
    "pyimagej>=1.5",
    "pyserial>=3.5",
    "mcp>=2.0",
    "uvicorn>=0.30",
    "pillow>=10",
]
permission.camera = "Fuji affiche et enregistre l'image de la caméra du microscope."

[tool.briefcase.app.fuji.macOS]
# Un .dmg par type de processeur (Apple Silicon, Intel) : plus petit et plus sûr à
# construire qu'une application « universelle ».
universal_build = false
min_os_version = "13.0"
info."NSLocalNetworkUsageDescription" = "Fuji se connecte aux moteurs ou au microscope branchés sur un autre ordinateur du réseau."

[tool.hatch.build.targets.wheel]
packages = ["src/fuji"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "gui: tests qui nécessitent un affichage Qt",
    "imagej: tests qui nécessitent Java + ImageJ (téléchargement Maven)",
]

[tool.ruff]
line-length = 110
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint.per-file-ignores]
"src/fuji/ui/icons.py" = ["E501"]  # tracés SVG
"src/fuji/remote/mcp_server.py" = ["E501"]  # descriptions des outils, lues par l'IA

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    "RUF001", "RUF002", "RUF003",  # accents et typographie française
    "SIM105", "SIM108", "SIM102", "SIM401", "RUF005", "RUF046",  # préférences de style
]
