# Leitz Diaplan (entièrement manuel) + caméra ToupTek E3ISPM08300KPD.
#
# Les lignes marquées « À ADAPTER » dépendent de ton matériel exact.
# Les calibrations faites dans Fuji (taille du pixel par objectif...) sont
# enregistrées dans une copie de ce profil : ~/.fuji/profiles/leitz-diaplan-touptek.yaml
name: Leitz Diaplan + ToupTek E3ISPM08300KPD
description: >-
  Microscope droit Leitz Diaplan, lumière transmise, entièrement manuel.
  Caméra couleur ToupTek E3ISPM08300KPD (USB 3, 8,3 MP). Prévu pour accueillir
  plus tard une platine motorisée et la fluorescence (Ploemopak).

instrument:
  manufacturer: Leitz
  model: Diaplan
  stand: droit
  # Objectifs Leitz gravés « 170/0.17 » : tube mécanique de 170 mm (à vérifier)
  tube_length: 170 mm
  eyepiece_magnification: 10
  condenser: "À ADAPTER (ex. condenseur 600, ON 0.90)"

# À ADAPTER : grossissement de l'adaptateur monture C (gravé dessus : 0.5x, 0.63x, 1x...)
camera_adapter_magnification: 1.0
# À ADAPTER : ouverture numérique maximale du condenseur (gravée sur le condenseur)
condenser_na: 0.9

devices:
  - name: camera
    label: ToupTek E3ISPM08300KPD
    driver: touptek.camera
    options:
      # Dossier où « fuji touptek install » a copié le SDK (valeur par défaut) :
      # sdk_path: ~/.fuji/touptek
      bit_depth: 12        # 8 ou 12 bits (12 = meilleure dynamique pour l'analyse)
      resolution_index: 0  # 0 = pleine résolution (3840 x 2160)

  - name: objectifs
    label: Revolver porte-objectifs
    driver: manual.state   # positions = liste des objectifs ci-dessous

  - name: mise_au_point
    label: Mise au point fine
    driver: manual.focus
    options:
      # À ADAPTER : valeur d'une graduation de la vis micrométrique (µm)
      um_per_division: 1.0

  - name: lampe
    label: Halogène 12 V 100 W
    driver: manual.light

  # Le condenseur (tourelle ou diaphragme de fond noir) : Fuji dit quand le tourner.
  # À ADAPTER : noms des positions de ta tourelle (ex. « Fond clair », « Fond noir », « Ph2 »).
  - name: condenseur
    label: Condenseur
    driver: manual.state
    options:
      labels: [Fond clair, Fond noir]

roles:
  camera: camera
  objective_changer: objectifs
  focus: mise_au_point
  transmitted_light: lampe

# À ADAPTER : mets ici tes objectifs réels (gravure sur le fût).
# pixel_size_um se remplit automatiquement avec l'assistant de calibration.
objectives:
  - {label: "4x/0.12", magnification: 4, na: 0.12}
  - {label: "10x/0.25", magnification: 10, na: 0.25}
  - {label: "40x/0.65", magnification: 40, na: 0.65}
  - {label: "100x/1.25 huile", magnification: 100, na: 1.25, immersion: huile}

channels:
  - name: Fond clair
    kind: transmission
    exposure_ms: 20
    states: {condenseur: Fond clair}
    lights: {lampe: {on: true}}

  # Fond noir : lampe à fond, diaphragme d'ouverture du condenseur grand ouvert.
  # À ADAPTER : max_objective_na = ouverture au-delà de laquelle le fond n'est plus noir
  # (vide : 0,65 avec un condenseur à sec ; mettre immersion_condenser: true pour un
  # condenseur de fond noir à huile).
  - name: Fond noir
    kind: fond noir
    exposure_ms: 200
    states: {condenseur: Fond noir}
    lights: {lampe: {on: true, intensity: 100}}

  # Plus tard, avec un Ploemopak (fluorescence) : déclarer les cubes et la lampe
  # dans « devices » (driver manual.state / manual.light), puis par exemple :
  # - name: GFP
  #   kind: fluorescence
  #   exposure_ms: 200
  #   states: {cubes: "I3 (bleu)"}
  #   lights: {lampe_hbo: {on: true}}
  #   color: green
default_channel: Fond clair
